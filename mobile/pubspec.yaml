name: voice_context_mobile
description: >
  Mobile app for the KI Voice Context Engine — button-triggered live voice
  dialog sessions over the OpenAI Realtime API (WebRTC), plus a simple
  Inbox/context view. See docs/implementation-plan.md at the repo root.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_webrtc: ^1.6.0
  http: ^1.2.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
